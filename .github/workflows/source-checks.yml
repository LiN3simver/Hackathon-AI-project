name: Public source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python scripts/check_public_release.py
      - run: python -m compileall -q apps/api/app scripts
      - run: npm ci
      - run: npm run build:web
      - run: npm run build:ops
